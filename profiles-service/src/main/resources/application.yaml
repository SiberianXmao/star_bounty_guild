spring:
  application:
    name: profiles-service

  datasource:
    url: jdbc:postgresql://localhost:5436/bounty_profiles
    username: postgres
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: bounty
        format_sql: true

  flyway:
    enabled: true
    schemas: bounty
    default-schema: bounty
    baseline-on-migrate: true
    locations:
      - classpath:db/migration
      - classpath:db/dev-migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/bounty-guild
          jwk-set-uri: http://localhost:8085/realms/bounty-guild/protocol/openid-connect/certs

  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: bounty-profiles-ratings-v1
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8083

app:
  internal-auth:
    header-name: X-Internal-Token
    token: ${APP_INTERNAL_AUTH_TOKEN}

  services:
    users:
      base-url: http://localhost:8080
    dictionary:
      base-url: http://localhost:8081

  kafka:
    topics:
      hunter-rated: bounty.reviews.hunter-rated.v1

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9083}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
