services:
  postgres:
    image: postgres:16-alpine
    container_name: bounty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bounty_guild
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Europe/Moscow
    ports:
      - "5432:5432"
    volumes:
      - bounty_postgres_data:/var/lib/postgresql/data

volumes:
  bounty_postgres_data: