services:
  postgres:
    image: postgres:16-alpine
    container_name: bounty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bounty_guild
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Europe/Moscow
    ports:
      - "5432:5432"
    volumes:
      - bounty_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bounty_guild"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: bounty-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bounty_guild
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_OPEN_IN_VIEW: "false"
      APP_SECURITY_JWT_SECRET: c3Rhci1ib3VudHktZ3VpbGQtZGV2LXNlY3JldC0zMi1ieXRlcy1taW4=
      APP_SECURITY_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: 30
      APP_SECURITY_JWT_REFRESH_TOKEN_EXPIRATION_DAYS: 14
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: bounty-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  bounty_postgres_data:
