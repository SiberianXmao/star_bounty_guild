services:
  user-postgres:
    image: postgres:16-alpine
    container_name: bounty-user-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bounty_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
      TZ: Europe/Moscow
    ports:
      - "5432:5432"
    volumes:
      - bounty_user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bounty_users"]
      interval: 5s
      timeout: 3s
      retries: 20

  dictionary-postgres:
    image: postgres:16-alpine
    container_name: bounty-dictionary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bounty_dictionary
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DICTIONARY_DB_PASSWORD:?Set DICTIONARY_DB_PASSWORD in .env}
      TZ: Europe/Moscow
    ports:
      - "5433:5432"
    volumes:
      - bounty_dictionary_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bounty_dictionary"]
      interval: 5s
      timeout: 3s
      retries: 20

  notification-postgres:
    image: postgres:16-alpine
    container_name: bounty-notification-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bounty_notifications
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in .env}
      TZ: Europe/Moscow
    ports:
      - "5434:5432"
    volumes:
      - bounty_notification_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bounty_notifications"]
      interval: 5s
      timeout: 3s
      retries: 20

  profiles-postgres:
    image: postgres:16-alpine
    container_name: bounty-profiles-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bounty_profiles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PROFILES_DB_PASSWORD:?Set PROFILES_DB_PASSWORD in .env}
      TZ: Europe/Moscow
    ports:
      - "5436:5432"
    volumes:
      - bounty_profiles_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bounty_profiles"]
      interval: 5s
      timeout: 3s
      retries: 20

  orders-postgres:
    image: postgres:16-alpine
    container_name: bounty-orders-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bounty_orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:?Set ORDERS_DB_PASSWORD in .env}
      TZ: Europe/Moscow
    ports:
      - "5437:5432"
    volumes:
      - bounty_orders_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bounty_orders"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak-postgres:
    image: postgres:16-alpine
    container_name: bounty-keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      TZ: Europe/Moscow
    ports:
      - "5435:5432"
    volumes:
      - bounty_keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: bounty-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    expose:
      - "6379"
    volumes:
      - bounty_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: bounty-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    command:
      - server
      - /data
      - --console-address
      - :9001
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - bounty_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: bounty-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?Set MINIO_APP_ACCESS_KEY in .env}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?Set MINIO_APP_SECRET_KEY in .env}
    volumes:
      - ./minio/policies:/config/policies:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/bounty-media
        mc anonymous set download local/bounty-media
        mc admin user add local "$$MINIO_APP_ACCESS_KEY" "$$MINIO_APP_SECRET_KEY" || true
        mc admin policy create local bounty-media-rw /config/policies/media-rw.json
        mc admin policy attach local bounty-media-rw --user "$$MINIO_APP_ACCESS_KEY"
    restart: "no"

  file-service:
    build:
      context: ./file-service
    container_name: bounty-file-service
    restart: unless-stopped
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_INTERNAL_AUTH_TOKEN: ${APP_INTERNAL_AUTH_TOKEN:?Set APP_INTERNAL_AUTH_TOKEN in .env}
      APP_STORAGE_ENDPOINT: http://minio:9000
      APP_STORAGE_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?Set MINIO_APP_ACCESS_KEY in .env}
      APP_STORAGE_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?Set MINIO_APP_SECRET_KEY in .env}
      APP_STORAGE_BUCKET: bounty-media
      APP_STORAGE_PUBLIC_BASE_URL: /media
    expose:
      - "8086"
      - "9086"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9086/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  dictionary-service:
    build:
      context: ./dictionary-service
    container_name: bounty-dictionary-service
    restart: unless-stopped
    depends_on:
      dictionary-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      file-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://dictionary-postgres:5432/bounty_dictionary
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DICTIONARY_DB_PASSWORD:?Set DICTIONARY_DB_PASSWORD in .env}
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      SPRING_CACHE_TYPE: redis
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8085/realms/bounty-guild
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/bounty-guild/protocol/openid-connect/certs
      APP_CACHE_TTL: 6h
      APP_INTERNAL_AUTH_TOKEN: ${APP_INTERNAL_AUTH_TOKEN:?Set APP_INTERNAL_AUTH_TOKEN in .env}
      APP_SERVICES_FILE_BASE_URL: http://file-service:8086
    ports:
      - "8081:8081"
    expose:
      - "9081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9081/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  kafka:
    image: apache/kafka:3.7.0
    container_name: bounty-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9094:9094"

  notification-service:
    build:
      context: ./notification-service
    container_name: bounty-notification-service
    restart: unless-stopped
    depends_on:
      notification-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-postgres:5432/bounty_notifications
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in .env}
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_KAFKA_TOPICS_APPLICATION_ACCEPTED: bounty.applications.application-accepted.v1
    ports:
      - "8082:8082"
    expose:
      - "9082"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9082/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  profiles-service:
    build:
      context: ./profiles-service
    container_name: bounty-profiles-service
    restart: unless-stopped
    depends_on:
      profiles-postgres:
        condition: service_healthy
      dictionary-service:
        condition: service_started
      keycloak:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://profiles-postgres:5432/bounty_profiles
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${PROFILES_DB_PASSWORD:?Set PROFILES_DB_PASSWORD in .env}
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8085/realms/bounty-guild
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/bounty-guild/protocol/openid-connect/certs
      APP_SERVICES_USERS_BASE_URL: http://user-service:8080
      APP_SERVICES_DICTIONARY_BASE_URL: http://dictionary-service:8081
      APP_INTERNAL_AUTH_TOKEN: ${APP_INTERNAL_AUTH_TOKEN:?Set APP_INTERNAL_AUTH_TOKEN in .env}
      APP_KAFKA_TOPICS_HUNTER_RATED: bounty.reviews.hunter-rated.v1
    ports:
      - "8083:8083"
    expose:
      - "9083"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9083/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  orders-service:
    build:
      context: ./orders-service
    container_name: bounty-orders-service
    restart: unless-stopped
    depends_on:
      orders-postgres:
        condition: service_healthy
      user-service:
        condition: service_started
      dictionary-service:
        condition: service_started
      profiles-service:
        condition: service_started
      kafka:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://orders-postgres:5432/bounty_orders
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${ORDERS_DB_PASSWORD:?Set ORDERS_DB_PASSWORD in .env}
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8085/realms/bounty-guild
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/bounty-guild/protocol/openid-connect/certs
      APP_SERVICES_USERS_BASE_URL: http://user-service:8080
      APP_SERVICES_DICTIONARY_BASE_URL: http://dictionary-service:8081
      APP_SERVICES_PROFILES_BASE_URL: http://profiles-service:8083
      APP_KAFKA_TOPICS_APPLICATION_ACCEPTED: bounty.applications.application-accepted.v1
      APP_KAFKA_TOPICS_HUNTER_RATED: bounty.reviews.hunter-rated.v1
      APP_INTERNAL_AUTH_TOKEN: ${APP_INTERNAL_AUTH_TOKEN:?Set APP_INTERNAL_AUTH_TOKEN in .env}
    ports:
      - "8084:8084"
    expose:
      - "9084"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9084/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: bounty-keycloak
    restart: unless-stopped
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8085
      KC_HOSTNAME_STRICT: "false"
      KEYCLOAK_USER_SERVICE_CLIENT_SECRET: ${KEYCLOAK_USER_SERVICE_CLIENT_SECRET:?Set KEYCLOAK_USER_SERVICE_CLIENT_SECRET in .env}
    command:
      - start-dev
      - --import-realm
    ports:
      - "8085:8080"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro

  user-service:
    build:
      context: ./user-service
    container_name: bounty-user-service
    restart: unless-stopped
    depends_on:
      user-postgres:
        condition: service_healthy
      dictionary-service:
        condition: service_started
      profiles-service:
        condition: service_started
      keycloak:
        condition: service_started
      file-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev,keycloak
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-postgres:5432/bounty_users
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8085/realms/bounty-guild
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/bounty-guild/protocol/openid-connect/certs
      APP_SERVICES_DICTIONARY_BASE_URL: http://dictionary-service:8081
      APP_SERVICES_PROFILES_BASE_URL: http://profiles-service:8083
      APP_SERVICES_FILE_BASE_URL: http://file-service:8086
      APP_SECURITY_PROVIDER: keycloak
      APP_SECURITY_KEYCLOAK_SERVER_URL: http://keycloak:8080
      APP_SECURITY_KEYCLOAK_REALM: bounty-guild
      APP_SECURITY_KEYCLOAK_CLIENT_ID: bounty-user-service
      APP_SECURITY_KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_USER_SERVICE_CLIENT_SECRET:?Set KEYCLOAK_USER_SERVICE_CLIENT_SECRET in .env}
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:?Set APP_SECURITY_JWT_SECRET in .env}
      APP_SECURITY_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: 30
      APP_SECURITY_JWT_REFRESH_TOKEN_EXPIRATION_DAYS: 14
      APP_INTERNAL_AUTH_TOKEN: ${APP_INTERNAL_AUTH_TOKEN:?Set APP_INTERNAL_AUTH_TOKEN in .env}
    expose:
      - "8080"
      - "9080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9080/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_AUTH_PROVIDER: local
        VITE_KEYCLOAK_URL: http://localhost:8085
        VITE_KEYCLOAK_REALM: bounty-guild
        VITE_KEYCLOAK_CLIENT_ID: bounty-frontend
    container_name: bounty-frontend
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_started
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s

  gateway:
    build:
      context: ./gateway
    container_name: bounty-gateway
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      user-service:
        condition: service_healthy
      dictionary-service:
        condition: service_healthy
      profiles-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "3000:80"

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: bounty-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - bounty_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  grafana:
    image: grafana/grafana:11.6.0
    container_name: bounty-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - bounty_grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  bounty_user_postgres_data:
  bounty_dictionary_postgres_data:
  bounty_notification_postgres_data:
  bounty_profiles_postgres_data:
  bounty_orders_postgres_data:
  bounty_keycloak_postgres_data:
  bounty_redis_data:
  bounty_minio_data:
  bounty_prometheus_data:
  bounty_grafana_data:
