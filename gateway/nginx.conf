resolver 127.0.0.11 valid=5s ipv6=off;

upstream bounty_frontend {
  zone bounty_frontend 64k;
  server frontend:80 resolve;
}

upstream bounty_user_service {
  zone bounty_user_service 64k;
  server user-service:8080 resolve;
}

upstream bounty_dictionary {
  zone bounty_dictionary 64k;
  server dictionary-service:8081 resolve;
}

upstream bounty_notification {
  zone bounty_notification 64k;
  server notification-service:8082 resolve;
}

upstream bounty_profiles {
  zone bounty_profiles 64k;
  server profiles-service:8083 resolve;
}

upstream bounty_orders {
  zone bounty_orders 64k;
  server orders-service:8084 resolve;
}

upstream bounty_minio {
  zone bounty_minio 64k;
  server minio:9000 resolve;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 10m;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/v1/dictionary {
    proxy_pass http://bounty_dictionary;
    proxy_http_version 1.1;
  }

  location /api/v1/notifications {
    proxy_pass http://bounty_notification;
    proxy_http_version 1.1;
  }

  location /api/v1/profiles {
    proxy_pass http://bounty_profiles;
    proxy_http_version 1.1;
  }

  location /api/v1/orders {
    proxy_pass http://bounty_orders;
    proxy_http_version 1.1;
  }

  location /api/v1/applications {
    proxy_pass http://bounty_orders;
    proxy_http_version 1.1;
  }

  location /api/v1/reviews {
    proxy_pass http://bounty_orders;
    proxy_http_version 1.1;
  }

  location /api/ {
    proxy_pass http://bounty_user_service;
    proxy_http_version 1.1;
  }

  location = /swagger-ui.html {
    proxy_pass http://bounty_user_service;
    proxy_http_version 1.1;
  }

  location /swagger-ui/ {
    proxy_pass http://bounty_user_service;
    proxy_http_version 1.1;
  }

  location /v3/api-docs {
    proxy_pass http://bounty_user_service;
    proxy_http_version 1.1;
  }

  location /media/ {
    proxy_pass http://bounty_minio/bounty-media/;
    proxy_http_version 1.1;
    proxy_set_header Host minio:9000;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://bounty_frontend;
    proxy_http_version 1.1;
  }
}
