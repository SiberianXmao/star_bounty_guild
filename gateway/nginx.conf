upstream bounty_frontend {
  server frontend:80;
}

upstream bounty_user_service {
  server user-service:8080;
}

upstream bounty_dictionary {
  server dictionary-service:8081;
}

upstream bounty_notification {
  server notification-service:8082;
}

upstream bounty_profiles {
  server profiles-service:8083;
}

upstream bounty_orders {
  server orders-service:8084;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 10m;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/v1/dictionary {
    proxy_pass http://bounty_dictionary;
    proxy_http_version 1.1;
  }

  location /api/v1/notifications {
    proxy_pass http://bounty_notification;
    proxy_http_version 1.1;
  }

  location /api/v1/profiles {
    proxy_pass http://bounty_profiles;
    proxy_http_version 1.1;
  }

  location /api/v1/orders {
    proxy_pass http://bounty_orders;
    proxy_http_version 1.1;
  }

  location /api/v1/applications {
    proxy_pass http://bounty_orders;
    proxy_http_version 1.1;
  }

  location /api/ {
    proxy_pass http://bounty_user_service;
    proxy_http_version 1.1;
  }

  location = /swagger-ui.html {
    proxy_pass http://bounty_user_service;
    proxy_http_version 1.1;
  }

  location /swagger-ui/ {
    proxy_pass http://bounty_user_service;
    proxy_http_version 1.1;
  }

  location /v3/api-docs {
    proxy_pass http://bounty_user_service;
    proxy_http_version 1.1;
  }

  location / {
    proxy_pass http://bounty_frontend;
    proxy_http_version 1.1;
  }
}
