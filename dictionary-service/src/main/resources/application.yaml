spring:
  application:
    name: dictionary-service

  datasource:
    url: jdbc:postgresql://localhost:5433/bounty_dictionary
    username: postgres
    password: postgres

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: bounty
        format_sql: true

  flyway:
    enabled: true
    schemas: bounty
    default-schema: bounty
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8081

app:
  internal-auth:
    header-name: X-Internal-Token
    token: ${APP_INTERNAL_AUTH_TOKEN:dev-internal-token}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
