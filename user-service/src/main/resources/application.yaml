spring:
  application:
    name: user-service

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: jdbc:postgresql://localhost:5432/bounty_users
    username: postgres
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: bounty
        format_sql: true

  flyway:
    enabled: true
    schemas: bounty
    default-schema: bounty
    baseline-on-migrate: true
    locations: classpath:db/migration

  cloud:
    openfeign:
      client:
        config:
          file-service:
            connect-timeout: 2000
            read-timeout: 10000

app:
  services:
    file:
      base-url: ${APP_SERVICES_FILE_BASE_URL:http://localhost:8086}

  internal-auth:
    header-name: X-Internal-Token
    token: ${APP_INTERNAL_AUTH_TOKEN}

  security:
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET}
      access-token-expiration-minutes: 60
      refresh-token-expiration-days: 30

server:
  port: 8080

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9080}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
