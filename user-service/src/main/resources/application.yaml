spring:
  application:
    name: user-service

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: jdbc:postgresql://localhost:5432/bounty_users
    username: postgres
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: bounty
        format_sql: true

  flyway:
    enabled: true
    schemas: bounty
    default-schema: bounty
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  storage:
    endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${APP_STORAGE_ACCESS_KEY}
    secret-key: ${APP_STORAGE_SECRET_KEY}
    bucket: ${APP_STORAGE_BUCKET:bounty-media}
    public-base-url: ${APP_STORAGE_PUBLIC_BASE_URL:/media}

  services:
    dictionary:
      base-url: http://localhost:8081
    profiles:
      base-url: http://localhost:8083

  internal-auth:
    header-name: X-Internal-Token
    token: ${APP_INTERNAL_AUTH_TOKEN}

  security:
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET}
      access-token-expiration-minutes: 60
      refresh-token-expiration-days: 30

server:
  port: 8080
