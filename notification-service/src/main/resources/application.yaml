spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:5434/bounty_notifications
    username: postgres
    password: postgres

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: bounty
        format_sql: true

  flyway:
    enabled: true
    schemas: bounty
    default-schema: bounty
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      missing-topics-fatal: false

app:
  kafka:
    topics:
      application-accepted: bounty.applications.application-accepted.v1

server:
  port: 8082

springdoc:
  swagger-ui:
    path: /swagger-ui.html
