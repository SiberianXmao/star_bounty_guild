spring:
  application:
    name: orders-service

  datasource:
    url: jdbc:postgresql://localhost:5437/bounty_orders
    username: postgres
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: bounty
        format_sql: true

  flyway:
    enabled: true
    schemas: bounty
    default-schema: bounty
    baseline-on-migrate: true
    locations:
      - classpath:db/migration
      - classpath:db/dev-migration

  kafka:
    bootstrap-servers: localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/bounty-guild
          jwk-set-uri: http://localhost:8085/realms/bounty-guild/protocol/openid-connect/certs

server:
  port: 8084

app:
  internal-auth:
    header-name: X-Internal-Token
    token: ${APP_INTERNAL_AUTH_TOKEN}

  services:
    users:
      base-url: http://localhost:8080
    dictionary:
      base-url: http://localhost:8081
    profiles:
      base-url: http://localhost:8083

  kafka:
    topics:
      application-accepted: bounty.applications.application-accepted.v1
      hunter-rated: bounty.reviews.hunter-rated.v1

  outbox:
    poll-delay-ms: 5000
    batch-size: 100
    max-attempts: 3
    max-error-length: 2000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9084}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
